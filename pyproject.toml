[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stac_dedl_core"
version = "0.1.0"
description = "Shared STAC Catalog framework for DestinE Data Lake uploads"
requires-python = ">=3.11"
dependencies = [
    "pystac==1.16.0",
    "pystac[validation, orjson]==1.16.0",
    "jsonschema==4.26.0",
    "orjson==3.13.0"
    "shapely==2.2.0",
    "python-magic==0.4.27",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "netCDF4==1.7.5.1.post1",
    "boto3==1.35.99",
    "botocore==1.35.99",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["stac_dedl_core*"]
