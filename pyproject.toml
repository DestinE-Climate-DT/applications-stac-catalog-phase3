[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stac_dedl_core"
version = "0.1.0"
description = "Shared STAC Catalog framework for DestinE Data Lake uploads"
requires-python = ">=3.10"
dependencies = [
    "pystac",
    "pystac[validation]",
    "pystac[orjson]",
    "shapely",
    "python-magic",
    "requests",
    "beautifulsoup4",
    "netCDF4",
    "boto3==1.35.99",
    "botocore==1.35.99",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["stac_dedl_core*"]
