        shortName: pvp
        product_type: forecast
        standard_name: Photovoltaic_Potential
        parameter_ID: "-"
      dimensions: [lat, lon, time]
      description: "Photovoltaic Potential represents the estimated daily energy output per square meter of photovoltaic panels, based on solar radiation and other relevant factors."
    Daily_Windspeed_Maxima:
      type: data
      unit: "ms-1"
      attrs:
        long_name: "Daily Wind Speed Maxima"
        shortName: ws
        product_type: forecast
        standard_name: Daily_Windspeed_Maxima
        parameter_ID: "-"
      dimensions: [lat, lon, time]
      description: "Daily maximum wind speed, representing the highest daily wind speed recorded."
    "99th Wind Speed Percentile":
      type: data
      unit: "ms-1"
      attrs:
        long_name: "99th Wind Speed Percentile"
        shortName: ws_99
        product_type: forecast
        standard_name: 99th_Wind_Speed_Percentile
        parameter_ID: "-"
      dimensions: [lat, lon, time]
      description: "The 99th percentile of monthly wind speeds at 100m height."
