        parameter_ID: "-"
      dimensions: [lat, lon, time]
      description: "Histogram bin conunts representing the distribution of wind speeds over specified bins, showing the frequency of occurrence. Should be taken together with Monthly Wind Speed Histogram bin edges."
    Monthly_Wind_Speed_Histogram_bin_edges:
      type: data
      unit: "ms^-1"
      attrs:
        long_name: "Monthly Wind Speed Histogram bin edges"
        shortName: bin_edges
        product_type: forecast
        standard_name: Monthly_Wind_Speed_Histogram_bin_edges
        parameter_ID: "-"
      dimensions: [lat, lon, time]
      description: "Histogram bin edges representing the edges of the bins of a windspeed histogram over a week. Should be taken together with Weekly Wind Speed Histogram counts."
    Daily_Photovoltaic_Potential:
      type: data
      unit: "kWh/m^2"
      attrs:
