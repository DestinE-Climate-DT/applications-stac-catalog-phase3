# Energy Indicators collection metadata.
#
# ⚠️ PROVISIONAL (drafted 2026-06-15). Values marked "TODO confirm" were INFERRED
# from the sample data (energy_indicators_2016_sample) and the staging script, not
# supplied by BSC. Confirm title / description / license / providers / full
# simulation list with the Energy Indicators developer before publishing.
#
# Confirmed from the data:
#   - id, model=IFS-NEMO, experiment=SSP3-7.0, generation=2, realization=1,
#     activity=projections, resolution=high (0.05deg), global grid, monthly items.
#   - one NetCDF per indicator per month (sample contained 'cdd' = Cooling Degree Days).

id: "EO.BSC.DAT.ENERGY_INDICATORS"

title: "Energy Indicators from the DestinE Climate DT" 

description: >
  Climate-based energy indicators derived from the DestinE Climate DT IFS-NEMO
  simulations (e.g. Cooling Degree Days), produced at high resolution (~0.05°,
  global). Indicators are provided as monthly NetCDF fields and support
  energy-sector impact assessment under the SSP3-7.0 projection scenario.


short_description: "Climate-based energy indicators (e.g. cooling degree days) from the DestinE Climate DT IFS-NEMO simulations."  # TODO confirm

# TODO confirm with BSC. 'proprietary' is the safe non-committal default; the other
license: "proprietary"

providers:
  - name: "Barcelona Supercomputing Center (BSC)"
    roles: [producer, processor]
    url: https://www.bsc.es/
  - name: "Destination Earth Data Lake (DEDL)"
    roles: [host]
    url: https://data.destination-earth.eu/

keywords:
  - Climate Change
  - Energy
  - Energy indicators
  - Cooling degree days
  - IFS-NEMO
  - Europe
  - Destination Earth
  - DestinE
  - Climate Digital Twin
  - Climate DT

# Global coverage (sample grid: lat -89.975..89.975, lon 0..359.95).
bbox: [-180, -90, 180, 90]

# Items are organised data/YYYY/MM/<item>/, one item folder per month.
item_folder_level: MM
item_config_optional: true
split_data_type_items: false

# Folder/item suffix order observed in the data:
#   <id>_<start>_<end>__model__experiment__generation__realization__activity__resolution
# This differs from the framework's default order (which puts activity before
# realization), so it is pinned explicitly — ItemGenerator parses item ids in this
# exact order, and getting it wrong mislabels realization vs activity.
property_order:
  - model
  - experiment
  - generation
  - realization
  - activity
  - resolution

# HPC paths — override per machine with the CATALOG_HOME_DIR / APP_DATA_DIR env vars.
# Based on the developer's transfer path, the collection root sits under
# .../member01/EO.BSC.DAT.ENERGY_INDICATORS, i.e. catalog_home_dir is its parent.

app_data_dir: /gpfs/scratch/ehpc01/bsc032056/a314/output/energy_indicators/20150101/member01
catalog_home_dir: /gpfs/scratch/ehpc01/bsc032056/a314/output/energy_indicators/20150101/member01

# The sample only covers the projection run (2015-2049). Energy likely also
# publishes the historical run — uncomment once confirmed with BSC.
# Resolution is carried as an override because the shared simulation entry does
# not define it (it is app-specific: 'high' here).
simulations:
  - ifs-nemo_generation-2_projection
  # - ifs-nemo_generation-2_historical

overrides:
  resolution: high
