# All HydroMet input lives here. Machine-specific paths can be overridden
# with the APP_DATA_DIR / CATALOG_HOME_DIR environment variables.
#
# This is the STAC *catalog* config (collection-level metadata for DEDL). It is
# NOT the HydroMet science-processing config (the KOSTRA/WetCat/IAMS parameters in
# the separate hydromet repo's example_config_hydromet.yml) — that one configures
# the model software, this one describes the published collection.

id: "EO.DWD.STAT.HYDROMET_EXTREMES"

# Local folder (under catalog_home_dir) holding metadata/ and data/. It is the
# folder the Climate DT workflow writes (<member>/EO.DWD.STAT.HYDROMET/, see
# get_stac_structure in the workflow's lib/common/utils/app_utils.sh) and the
# root of the bucket: its contents land at the root of
# s3://usergenerated-proposal-eo.dwd.stat.hydromet-extremes/ (data/, metadata/;
# derived from `id`, confirmed by DWD) on upload, so it is
# not an extra folder level. Item and collection ids still use `id` above.
collection_root_dir: "EO.DWD.STAT.HYDROMET"

title: "HydroMet: Catalogue of extreme precipitation events"

description: "Precipitation is an essential variable to assess the severity of many extreme weather events. As a first assessment, it might be sufficient to look at daily rainfall totals for a given region. However, an in-depth analysis requires local information on severity, affected area and statistical return times to enable the development of fitted adaptation strategies. HydroMet fulfils this need by providing information on the intensity, duration, spatial extent and return time of extreme precipitation events over Europe based on DestinE Climate DT model data. More information can be found in the [Climate DT user guide](https://platform.destine.eu/services/documents-and-api/doc/?service_name=climate-dt-user-guide).\n\

The extreme precipitation parameters produced by HydroMet are based on existing products of the German Meteorological Service (DWD): KOSTRA2020, the latest version of KOSTRA-DWD (Shehu et al., 2023), and CatRaRE, Catalogue of Radar-based heavy Rainfall Events (Lengfeld et al., 2021). KOSTRA is a coordinated effort across German Federal states to develop methods for evaluating precipitation extremes from gauge-based observations. The system, developed over three decades, provides data about precipitation levels, duration and the annual return interval. CatRaRE is a software package able to detect and define extreme rain events and, at the same time, generate a catalogue with meteorological and geographical information for each event. At DWD, it is applied to radar data. HydroMet combines both products for a consistent dataset on the climatological scale.\n\

Shehu, B., Willems, W., Stockel, H., Thiele, L.-B., & Haberlandt, U. (2023). Regionalisation of rainfall depth–duration–frequency curves with different data types in Germany.\n\

Hydrology and Earth System Sciences, 27(5), 1109–1132. https://doi.org/10.5194/hess-27-1109-2023 Lengfeld, K., Walawender, E., Winterrath, T., & Becker, A. (2021). CatRaRE: A Catalogue of radar-based heavy rainfall events in Germany derived from 20 years of data. Meteorologische Zeitschrift, 30(6), 469–487. https://doi.org/10.1127/metz/2021/1088"

short_description: "The HydroMet application provides statistics and an event catalogue of extreme rainfall from the Climate Adaptation Digital Twin."

license: CC-BY-4.0

# Two scientific publications — see `publications:` below (sci:publications).
publications:
  - doi: "10.1127/metz/2021/1088"
    citation: "Lengfeld, K., Walawender, E., Winterrath, T., & Becker, A. (2021). CatRaRE: A Catalogue of radar-based heavy rainfall events in Germany derived from 20 years of data. Meteorologische Zeitschrift, 30(6), 469–487. https://doi.org/10.1127/metz/2021/1088"
  - doi: "10.5194/hess-27-1109-2023"
    citation: "Shehu, B., Willems, W., Stockel, H., Thiele, L.-B., & Haberlandt, U. (2023). Regionalisation of rainfall depth–duration–frequency curves with different data types in Germany. Hydrology and Earth System Sciences, 27(5), 1109–1132. https://doi.org/10.5194/hess-27-1109-2023"

related:
  url: "https://destination-earth.eu/use-cases/simulating-the-future-of-extreme-events/"
  title: "Simulating the Future of Extreme Events"

keywords:
  - NetCDF
  - Climate
  - Precipitation
  - Extreme events

providers:
  - name: "Deutscher Wetterdienst (DWD)"
    roles: [producer]
    url: https://www.dwd.de/
  - name: "European Centre for Medium-Range Weather Forecasts (ECMWF)"
    roles: [licensor]
    url: https://www.ecmwf.int/
  - name: "Destination Earth Data Lake (DEDL)"
    roles: [host]
    url: https://data.destination-earth.eu/

thumbnail_url: "https://destination-earth.eu/wp-content/uploads/2023/10/hydromet_fig1-1771x547-1.png"
thumbnail_mime: "image/png"

# Explicit order, matching the already-published collection (scientific, timestamps,
# datacube) — without this, the order is auto-derived (scientific, datacube, timestamps).
stac_extensions:
  - "https://stac-extensions.github.io/scientific/v1.0.0/schema.json"
  - "https://stac-extensions.github.io/timestamps/v1.1.0/schema.json"
  - "https://stac-extensions.github.io/datacube/v2.2.0/schema.json"

bbox: [-21.0, 27.025, 45.0, 71.975]

# Items are organised data/<start_year>/<item>/ — ONE item per workflow experiment,
# covering the experiment's own period (from its DATELIST and length), not split
# by month like HydroLand or Energy. A single item has the DDF/KO_params NC files
# plus one extreme-event CSV file per region for that period.
item_folder_level: YYYY
item_config_optional: true
split_data_type_items: false

# Folder/item suffix order and bare (non-prefixed) values match the item folders
# the workflow writes: <id>_<start>_<end>__model__experiment__generation__
# realization__activity__resolution, with its REQUEST values as they are
# (no "generation-"/"realization-" prefix, unlike HydroLand's convention).
property_order:
  - model
  - experiment
  - generation
  - realization
  - activity
  - resolution

# HPC paths — override with env vars when running elsewhere
app_data_dir: /path/to/hydromet/output  # no known DWD production path yet — override locally
catalog_home_dir: /work/lealroja/applications-stac-catalog-phase3-execution

# Temporal extent of the collection, set explicitly to cover all workflow
# experiments (historical, projections and storylines), matching the datacube
# `time` extent below.
temporal_start: "1990-01-01T00:00:00Z"
temporal_end: "2049-12-31T23:00:00Z"

# Unused for HydroMet: the temporal extent is set above and item folders come
# from the workflow, with its own periods and REQUEST values (see
# staging/workflow_items.py). Kept because load_app_config requires at least one.
simulations:
  - ifs-nemo_generation-2_historical
  # - ifs-nemo_generation-2_projection
  # - ifs-fesom_generation-2_historical
  # - ifs-fesom_generation-2_projection
  # - icon_generation-2_historical
  # - icon_generation-2_projection

# STAC datacube extension (cube:dimensions / cube:variables), inlined so all
# collection config lives in one file. Read by stac_dedl_core.collection_builder.
datacube:
  dimensions:
    lat:
      type: spatial
      axis: y
      extent: [27.025, 71.975]
      description: Latitude
    lon:
      type: spatial
      axis: x
      extent: [-21.0, 45.0]
      description: Longitude
    time:
      type: temporal
      extent: ["1990-01-01T00:00:00Z", "2049-12-31T23:00:00Z"]
      description: Durations of the event in minutes
    durations:
      type: temporal
      extent: [60, 10080]
      description: Durations of the event in minutes
    return_time:
      type: temporal
      extent: [1, 100]
      description: Return period of the event in years
    number:
      type: additional
      extent: [1, 677865]
      description: Number of the captured event
  variables:
    xi:
      description: Location parameter xi describing the Generalized Extreme Value distribution.
      dimensions: [lat, lon]
    alpha:
      description: Scale parameter alpha describing the Generalized Extreme Value distribution.
      dimensions: [lat, lon]
    theta:
      description: First Koutsoyiannis-Parameter theta describing the Generalized Extreme Value distribution.
      dimensions: [lat, lon]
    eta:
      description: Second Koutsoyiannis-Parameter theta describing the Generalized Extreme Value distribution.
      dimensions: [lat, lon]
    beta:
      description: Balancing parameter beta describing the Generalized Extreme Value distribution.
      dimensions: [time, durations, lat, lon]
    iams:
      description: Intensity Annual Maxima Series indicating the maximum precipitation of each year for different durations.
      dimensions: [time, durations, lat, lon]
    DDF:
      description: Depth-Duration-Frequency represents in a rain event the relation between rain depth, duration and return period (frequency).
      dimensions: [return_time, durations, lat, lon]
      unit: mm
    Object_ID:
      description: Code for the object the event was selected from comprised of end date in numerical form, duration window in hours, and a running number
      dimensions: [number]
    Event_ID:
      description: Code for event comprised of return period, selection parameter and running number
      dimensions: [number]
    Start_Time:
      description: Start date of event
      dimensions: [number]
    End_Time:
      description: End date of event
      dimensions: [number]
    Duration:
      description: Duration of event
      dimensions: [number]
      unit: hours
    Area:
      description: Number of pixels included within event or area in 25 km²
      dimensions: [number]
      unit: 25 km²
    RRmean:
      description: Mean precipitation amount within event
      dimensions: [number]
      unit: mm
    Tmean_KOSTRA:
      description: " Mean return period of the event"
      dimensions: [number]
      unit: years
    Eta_KOSTRA:
      description: Extremity of event
      dimensions: [number]
    RRmax:
      description: Maximum precipitation within the event
      dimensions: [number]
      unit: mm
    RR_Tmax:
      description: Precipitation amount with the maximum return period
      dimensions: [number]
      unit: mm
    Tmax_KOSTRA:
      description: Maximum return period within the event
      dimensions: [number]
      unit: years
    x_center:
      description: Pixel number on x-axis of the event center
      dimensions: [number]
    y_center:
      description: Pixel number on y-axis of the event center
      dimensions: [number]
    lon_center:
      description: Longitude of the event center
      dimensions: [number]
      unit: "°"
    lat_center:
      description: Latitude of the events center
      dimensions: [number]
      unit: "°"
    x_RRmax:
      description: Pixel number on the x-axis of the maximum precipitation within the event
      dimensions: [number]
    y_RRmax:
      description: Pixel number on the y-axis of the maximum precipitation within the event
      dimensions: [number]
    lon_RRmax:
      description: " Longitude of the maximum precipitation within the event"
      dimensions: [number]
      unit: "°"
    lat_RRmax:
      description: Latitude of the maximum precipitation within the event
      dimensions: [number]
      unit: "°"
    MPP_flag:
      description: Indicator for anomalies of data, when MPP (Maximum Pixel Precipitation) was exceeded it is set to 1.
      dimensions: [number]
