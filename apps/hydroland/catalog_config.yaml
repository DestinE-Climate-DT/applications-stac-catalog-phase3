providers:
  - name: "Destination Earth Climate DT & Helmholtz-Zentrum für Umweltforschung GmbH (UFZ)"
    roles: [producer, processor, licensor]
    url: https://destination-earth.eu
  - name: "Destination Earth Data Lake (DEDL)"
    roles: [host]
    url: https://data.destination-earth.eu/

thumbnail_url: https://s3.central.data.destination-earth.eu/swift/v1/dedl-public/collections/eo-ufz-dat-ifs_nemo_hydroland.png
thumbnail_mime: image/png

bbox: [-180, -56, 180, 84]

# Keep the temporal extent exactly as already published on the DEDL (the derived
# default would narrow the end by one hour to 23:00:00Z).
temporal_end: "2049-12-31T23:59:59Z"

item_folder_level: MM
item_config_optional: true
split_data_type_items: true
# Items already published on S3 use 'collection_data_type'; keep new items consistent.
published_data_type_key: collection_data_type

# Rules to classify NC files into item data_type suffixes (see docs/RUN_GUIDE.md)
data_type_rules:
  - {match: "_mHM_Fluxes_States", data_type: mhm}
  - {match: "_mRM_Fluxes_States", data_type: mrm}

# Machine-specific paths — override via APP_DATA_DIR / CATALOG_HOME_DIR env vars.
# See local_paths.sh at the repo root for the real paths on each machine.
app_data_dir: /path/to/data/mhm
catalog_home_dir: /path/to/stac-catalog-output

# Control (cont) runs and storylines exist in _shared/simulations.yaml but are deliberately not published by HydroLand.
simulations:
  - ifs-nemo_generation-2_historical
  - ifs-nemo_generation-2_projection
  # - ifs-fesom_generation-2_historical
  # - ifs-fesom_generation-2_projection
  # - icon_generation-2_historical
  # - icon_generation-2_projection

# Multi-year indicator products (aridity index, soil moisture, etc.) — see docs/RUN_GUIDE.md
indicators:
  source_dir: /data/hsd/projects/destine_operational_results/ifs-nemo/phase_2/historical/indicators
  reference_simulation: ifs-nemo_generation-2_historical
  scenario_simulation: ifs-nemo_generation-2_projection
  scenario_markers: [scen, percent_change]
