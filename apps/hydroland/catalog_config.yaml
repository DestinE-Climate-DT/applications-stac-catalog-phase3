# All HydroLand input lives here. Machine-specific paths can be overridden
# with the APP_DATA_DIR / CATALOG_HOME_DIR environment variables.

id: EO.UFZ.DAT.HYDROLAND
title: "Hydroland - Land Surface Hydrology Simulations. Second generation IFS-NEMO, IFS-FESOM and ICON Historical 1990-2014 run and projection 2015-2049 run."
description: |-
  Land surface hydrology governs the availability of water for ecosystems, agriculture and human use, and its response to climate change is a key concern for adaptation planning. The HydroLand application provides land surface hydrology indicators, including soil moisture, discharge and aridity, derived from DestinE Climate Digital Twin (Climate DT) model data. The application enables users to assess the spatial distribution, seasonal variability and long-term changes of hydrological conditions. More information can be found in the Climate DT User Guide.

  HydroLand is based on the Mesoscale Hydrologic Model (mHM, mhm-ufz.org), a distributed hydrological model that simulates the terrestrial water cycle from meteorological forcing. mHM is driven by Climate DT output to produce fluxes such as river discharge, evapotranspiration and soil moisture, which are then processed into user-oriented indicators covering soil moisture, discharge, and aridity. The dataset also includes the original mHM outputs and figures documenting model validation and selected results.

  By applying mHM consistently to Climate DT simulations, the application provides a harmonised assessment of current and future hydrological conditions globally, supporting the analysis of drought, water availability and climate-driven trends in the terrestrial water cycle.
short_description: |-
  The Hydroland application uses outputs from the mesoscale Hydrologic Model (mHM, mhm-ufz.org), including hydrological variables such as river discharge and soil moisture. It also provides derived indicators: Soil Moisture Indicators, Aridity Index, and Discharge Indicators.

