name: stac-catalog
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip

  # Data / science
  - xarray
  - pandas
  - netcdf4
  - numpy
  - shapely
  - pyyaml

  # HTTP / parsing
  - requests
  - beautifulsoup4

  # AWS S3 (pinned — boto3 latest has a known issue)
  - boto3=1.35.99
  - botocore=1.35.99

  # Env / config
  - python-dotenv

  # Testing
  - pytest

  # MIME detection (bundles libmagic on conda-forge)
  - python-magic

  # pip-only packages
  - pip:
    - pystac
    - "pystac[validation]"
    - "pystac[orjson]"
    # Install the shared framework from this repo (run from repo root)
    - "-e ."
